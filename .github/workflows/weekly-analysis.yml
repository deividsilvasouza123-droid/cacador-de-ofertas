name: Weekly Content Analysis

on:
  schedule:
    - cron: '0 23 * * 0'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/analyze.py
      - name: Commit analysis
        run: |
          git config user.name 'Caçador de Ofertas Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output/metricas/recomendacoes.json
          git diff --cached --quiet || git commit -m 'chore: atualizar recomendações de conteúdo'
          git push || true
